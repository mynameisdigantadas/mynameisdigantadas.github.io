<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Template</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #222;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 95vh;
            margin: auto;
            background: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Chat Header */
        .chat-header {
            background: #2966c1;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #ffffff;
            color: #075e54;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .chat-name {
            font-size: 16px;
            font-weight: bold;
        }

        .chat-status {
            font-size: 12px;
            color: #d4f5ed;
            margin-top: 4px;
        }

        .chat-header-buttons button {
            background: transparent;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #e5ddd5;
            background-image: linear-gradient(
                rgba(255,255,255,0.15),
                rgba(255,255,255,0.15)
            );
        }

        .message {
            display: flex;
            margin-bottom: 12px;
            width: 100%;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.user .message-content {
            background: #c6ecf8;
            border-bottom-right-radius: 3px;
        }

        .message.bot .message-content {
            background: white;
            border-bottom-left-radius: 3px;
        }

        .message-time {
            font-size: 10px;
            color: #777;
            text-align: right;
            margin-top: 5px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 12px;
            color: #777;
            font-size: 13px;
        }

        /* Input Area */
        .chat-input-area {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #f0f0f0;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            border: none;
            outline: none;
            border-radius: 25px;
            padding: 12px 15px;
            font-size: 15px;
            background: white;
        }

        .send-button {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #2966c1;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send-button:hover {
            background: #064e45;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        /* Responsive */
        @media (min-width: 601px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .chat-container {
                height: 85vh;
                height: 85dvh;
                border-radius: 12px;
                box-shadow: 0 5px 30px rgba(0,0,0,0.15);
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">

        <div class="chat-header-info">

            <div class="chat-avatar">
                🤖
            </div>

            <div>
                <div class="chat-name">AI Chat Assistant</div>
                <div class="chat-status" id="chatStatus">
                    Online
                </div>
            </div>

        </div>

        <div class="chat-header-buttons">
            <button onclick="clearChat()" title="Clear Chat">🗑</button>
        </div>

    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">

        <div class="message bot">
            <div class="message-content">
                Hello! 👋 Welcome to the chat.
                <br>
                How can I help you today?

                <div class="message-time">
                    <span class="time"></span>
                </div>
            </div>
        </div>

    </div>

    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typingIndicator">
        Assistant is typing...
    </div>

    <!-- Input -->
    <div class="chat-input-area">

        <input
            type="text"
            id="chatInput"
            class="chat-input"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button
            class="send-button"
            id="sendButton"
            onclick="sendMessage()"
            title="Send Message"
        >
            ➤
        </button>

    </div>

</div>

<script type="text/javascript">

    var chatMessages = document.getElementById("chatMessages");
    var chatInput = document.getElementById("chatInput");
    var typingIndicator = document.getElementById("typingIndicator");

    // Current time
    function getCurrentTime() {

        var now = new Date();

        var hours = now.getHours();
        var minutes = now.getMinutes();

        var ampm = hours >= 12 ? "PM" : "AM";

        hours = hours % 12;

        if (hours === 0) {
            hours = 12;
        }

        return (
            ("0" + hours).slice(-2) +
            ":" +
            ("0" + minutes).slice(-2) +
            " " +
            ampm
        );

    }

    // Update welcome message time
    var welcomeTime = document.querySelector(".time");

    if (welcomeTime) {
        welcomeTime.textContent = getCurrentTime();
    }

    // Create message
    function addMessage(text, sender) {

        var message = document.createElement("div");

        message.className = "message " + sender;

        var content = document.createElement("div");

        content.className = "message-content";

        // Safe text output
        content.appendChild(document.createTextNode(text));

        var time = document.createElement("div");

        time.className = "message-time";

        time.textContent = getCurrentTime();

        content.appendChild(time);

        message.appendChild(content);

        chatMessages.appendChild(message);

        scrollToBottom();

    }

    // Send message
    function sendMessage() {

        var text = chatInput.value.trim();

        if (text === "") {
            return;
        }

        addMessage(text, "user");

        chatInput.value = "";

        showTyping();

        // Demo response
        setTimeout(function() {

            hideTyping();

            addMessage(
                "Thank you for your message! This is a demo chat response.",
                "bot"
            );

        }, 1000);

    }

    // Enter key
    chatInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

    // Typing indicator
    function showTyping() {
        typingIndicator.style.display = "block";
        scrollToBottom();
    }

    function hideTyping() {
        typingIndicator.style.display = "none";
    }

    // Scroll to bottom
    function scrollToBottom() {

        chatMessages.scrollTop = chatMessages.scrollHeight;

    }

    // Clear chat
    function clearChat() {

        if (confirm("Are you sure you want to clear the chat?")) {

            chatMessages.innerHTML = "";

        }

    }

</script>

</body>
</html>
